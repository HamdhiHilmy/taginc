<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>@Tag Inc admin</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{
  --ink:#231F20;--red:#ED1C24;--red-deep:#CC181F;--red-text:#B8141B;--blue:#1F3FA6;
  --paper:#FFFFFF;--mist:#F6F5F5;--stone:#EFEEEE;--line:#E3E1E1;--muted:#4A4647;--on-dark:#D9D7D7;
  --display:'Montserrat','Arial Black',sans-serif;--body:'Figtree','Segoe UI',system-ui,sans-serif;
  color-scheme:light;box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
html{background:var(--mist)}
body{margin:0;background:var(--mist);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
h1,h2,p{margin:0}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
img{max-width:100%;display:block}

.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 20px;border-radius:4px;border:2px solid transparent;font:700 15px/1.2 var(--body);text-decoration:none;cursor:pointer}
.btn[disabled]{opacity:.55;cursor:default}
.btn-red{background:var(--red);color:#fff}
.btn-red:hover{background:var(--red-deep)}
.btn-light{background:#fff;color:var(--ink);border-color:var(--ink)}
.btn-outline{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn-outline:hover{background:var(--ink);color:#fff}
.btn-ghost-light{background:transparent;color:#fff;border-color:#fff}
.btn-ghost-light:hover{background:#fff;color:var(--ink)}
.btn-danger{background:transparent;color:var(--red-text);border-color:var(--red-text)}
.btn-small{min-height:40px;padding:7px 14px;font-size:14px}

.weave{background-color:var(--stone);background-image:repeating-linear-gradient(45deg,rgba(35,31,32,.06) 0 2px,transparent 2px 9px),repeating-linear-gradient(-45deg,rgba(35,31,32,.06) 0 2px,transparent 2px 9px)}

.adminbar{position:sticky;top:0;z-index:5;background:var(--blue);color:#fff}
.adminbar-in{max-width:1000px;margin:0 auto;padding:12px 24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 24px}
.adminbar-msg{font-weight:600;flex:1 1 260px}
.adminbar-actions{display:flex;flex-wrap:wrap;gap:10px}
.adminbar .btn-light{border-color:#fff}

.admin-main{max-width:1000px;margin:0 auto;padding:28px 24px 72px;display:flex;flex-direction:column;gap:24px}
.admin-section{background:#fff;border:1px solid var(--line);border-radius:8px;padding:24px}
.admin-section-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.admin-section h2{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-0.01em}

.photo-list,.product-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:16px}
.photo-item,.product-item{display:flex;align-items:center;gap:16px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.photo-list>:last-child,.product-list>:last-child{border-bottom:0;padding-bottom:0}
.photo-thumb{width:64px;height:64px;border-radius:4px;overflow:hidden;flex:none}
.photo-thumb img,.product-thumb img{width:100%;height:100%;object-fit:cover}
.product-thumb{width:56px;height:74px;border-radius:4px;overflow:hidden;flex:none}
.photo-item-body,.product-item-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.product-item-body{gap:2px}
.photo-item-label{font-weight:600}
.product-item-name{font-weight:600;overflow-wrap:anywhere}
.product-item-meta{font-size:14px;color:var(--muted)}
.photo-controls{display:flex;flex-wrap:wrap;gap:8px}
.hint{font-size:14px;color:var(--muted)}
.hint a{color:inherit;font-weight:600}
.admin-loading{max-width:1000px;margin:60px auto;padding:0 24px;color:var(--muted);text-align:center}

.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.auth-card{width:min(400px,100%);background:#fff;border-radius:8px;padding:32px;display:flex;flex-direction:column;gap:16px;box-shadow:0 14px 40px rgba(35,31,32,.14)}
.auth-brand{font:800 15px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;color:var(--muted)}
.auth-card h1{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-0.01em}

.field{display:flex;flex-direction:column;gap:6px;border:0;margin:0;padding:0;min-width:0}
.field>label,.field>legend,.field-title{font-weight:600;padding:0}
.field input[type=text],.field input[type=number],.field input[type=password],.field select{font:inherit;min-height:46px;padding:8px 12px;border:2px solid var(--ink);border-radius:4px;background:#fff;color:var(--ink);width:100%}
.radios{display:flex;flex-wrap:wrap;gap:4px 28px}
.radios label{display:flex;align-items:center;gap:8px;min-height:40px;font-weight:500}
.radios input{width:18px;height:18px;margin:0;accent-color:var(--red)}
.form-error{color:var(--red-text);font-weight:600}
.form-error:empty{display:none}

.dialog{border:0;border-radius:8px;padding:0;width:min(520px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto;color:var(--ink);background:#fff}
.dialog::backdrop{background:rgba(35,31,32,.6)}
.dialog-in{padding:28px;display:flex;flex-direction:column;gap:18px}
.dialog h2{font-size:26px;font-family:var(--display);font-weight:800}
.photo-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.photo-row .photo-thumb{width:72px;height:96px}
.dialog-actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.dialog-actions .spacer{flex:1 1 0}

@media (max-width:560px){
  .admin-main{padding:20px 16px 56px}
  .admin-section{padding:18px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  'use strict';

  function h(tag, attrs, kids) {
    var el = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        var v = attrs[k];
        if (v === null || v === undefined || v === false) return;
        if (k === 'class') el.className = v;
        else if (k === 'text') el.textContent = v;
        else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
        else if (v === true) el.setAttribute(k, '');
        else el.setAttribute(k, v);
      });
    }
    if (kids !== null && kids !== undefined && kids !== false) {
      (Array.isArray(kids) ? kids : [kids]).forEach(function (c) {
        if (c === null || c === undefined || c === false) return;
        el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
      });
    }
    return el;
  }

  function formatPrice(n) {
    var num = Number(n);
    if (!isFinite(num)) return '';
    return 'Rs. ' + num.toLocaleString('en-US', { maximumFractionDigits: 2 });
  }

  function newId() {
    return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }

  function readImage(file, max, cb) {
    if (!file || String(file.type).indexOf('image/') !== 0) { cb(new Error('not an image')); return; }
    var reader = new FileReader();
    reader.onerror = function () { cb(new Error('read failed')); };
    reader.onload = function () {
      var img = new Image();
      img.onerror = function () { cb(new Error('decode failed')); };
      img.onload = function () {
        var scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        var c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.naturalWidth * scale));
        c.height = Math.max(1, Math.round(img.naturalHeight * scale));
        var ctx = c.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        var out, tint = '';
        try {
          out = c.toDataURL('image/jpeg', 0.8);
          var px = ctx.getImageData(Math.min(4, c.width - 1), Math.min(4, c.height - 1), 1, 1).data;
          tint = 'rgb(' + px[0] + ',' + px[1] + ',' + px[2] + ')';
        } catch (e) { cb(e); return; }
        cb(null, out, tint);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  /* Uploads an already-resized data URL (from readImage) to photo storage, resolving its public URL. */
  function uploadPhoto(dataUrl) {
    return fetch('/api/upload', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ dataUrl: dataUrl })
    }).then(function (res) {
      if (!res.ok) throw new Error('upload_failed');
      return res.json();
    }).then(function (data) { return data.url; });
  }

  var CATS = [
    { id: 'tshirt', label: 'T-shirt' }, { id: 'shirt', label: 'Shirt' }, { id: 'hoodies', label: 'Hoodies' },
    { id: 'denims', label: 'Denims' }, { id: 'joggers', label: 'Jogger Pants' }, { id: 'veshti', label: 'Veshti' },
    { id: 'shorts', label: 'Shorts' }, { id: 'inner', label: 'Inner wears' }, { id: 'vests', label: 'Vests' },
    { id: 'others', label: 'Others' }
  ];
  function catOf(p) {
    for (var i = 0; i < CATS.length; i++) { if (CATS[i].id === p.cat) return CATS[i]; }
    return CATS[CATS.length - 1];
  }

  var state = { logo: '', photos: {}, alts: {}, tints: {}, products: [] };
  var saved = JSON.stringify(state);
  var loaded = false;   // true once the initial /api/state + /api/auth/session calls have both returned
  var loggedIn = false;
  var ownerExists = false;
  var busy = false;
  var notice = '';
  var dlg = null;

  function dirty() { return JSON.stringify(state) !== saved; }
  function changed() { notice = ''; render(); }

  function discard() {
    state = JSON.parse(saved);
    notice = '';
    render();
  }

  function signOut() {
    loggedIn = false;
    notice = '';
    closeForm();
    render();
    fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' }).catch(function () { /* cookie expires on its own */ });
  }

  /* ---------- publishing ---------- */

  function publishError(status) {
    if (status === 401) return 'You’ve been signed out. Sign in again, then publish.';
    if (status === 413) return 'The site is too large to publish. Remove a few photos, then publish again.';
    if (status === 429) return 'Too many publishes in a short time. Wait a minute, then publish again.';
    return 'Publishing didn’t go through. Check your connection, then publish again.';
  }

  function sendPublish(next) {
    var body = JSON.parse(JSON.stringify(next));
    return fetch('/api/publish', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify(body)
    }).then(function (res) {
      if (!res.ok) return publishError(res.status);
      return res.json().then(function (data) {
        body.updated = data.updated;
        state = body;
        saved = JSON.stringify(state);
        return true;
      });
    }, function () { return 'Publishing didn’t go through. Check your connection, then publish again.'; });
  }

  function publish() {
    if (busy || !dirty()) return;
    busy = true;
    notice = '';
    render();
    sendPublish(state).then(function (res) {
      busy = false;
      notice = res === true ? 'Published. Visitors now see your changes.' : res;
      render();
    });
  }

  /* ---------- photos (logo, hero banner, department photos) ---------- */

  function photoRow(key, label, max) {
    var src = state.photos[key];
    var thumb = h('div', { class: 'photo-thumb weave' }, src ? h('img', { src: src, alt: '' }) : null);
    var pickBtn;
    var input = h('input', {
      type: 'file', accept: 'image/*', class: 'visually-hidden', tabindex: '-1', 'aria-hidden': 'true',
      onchange: function (e) {
        var f = e.target.files && e.target.files[0];
        if (!f) return;
        readImage(f, max, function (err, url, tint) {
          if (err) { notice = 'That file couldn’t be read as a photo. Try a JPG or PNG.'; render(); return; }
          pickBtn.disabled = true;
          pickBtn.textContent = 'Uploading…';
          uploadPhoto(url).then(function (hostedUrl) {
            state.photos[key] = hostedUrl;
            delete state.alts[key];
            if (tint) state.tints[key] = tint; else delete state.tints[key];
            changed();
          }, function () {
            notice = 'That photo couldn’t be uploaded. Check your connection and try again.';
            render();
          });
        });
      }
    });
    pickBtn = h('button', { class: 'btn btn-light btn-small', type: 'button', onclick: function () { input.click(); } }, src ? 'Change photo' : 'Add photo');
    var removeBtn = src ? h('button', {
      class: 'btn btn-light btn-small', type: 'button',
      onclick: function () { state.photos[key] = ''; delete state.alts[key]; delete state.tints[key]; changed(); }
    }, 'Remove photo') : null;
    return h('li', { class: 'photo-item' }, [
      thumb,
      h('div', { class: 'photo-item-body' }, [
        h('div', { class: 'photo-item-label', text: label }),
        h('div', { class: 'photo-controls' }, [input, pickBtn, removeBtn])
      ])
    ]);
  }

  function photosSection() {
    return h('section', { class: 'admin-section' }, [
      h('h2', { text: 'Photos' }),
      h('ul', { class: 'photo-list' }, [
        photoRow('logo', 'Logo', 600),
        photoRow('hero', 'Homepage banner photo', 1600),
        photoRow('men', 'Men department photo', 1280),
        photoRow('kids', 'Kids department photo', 1280)
      ])
    ]);
  }

  /* ---------- products ---------- */

  function productRow(p) {
    return h('li', { class: 'product-item' }, [
      h('div', { class: 'product-thumb weave' }, p.photo ? h('img', { src: p.photo, alt: '' }) : null),
      h('div', { class: 'product-item-body' }, [
        h('div', { class: 'product-item-name', text: p.name }),
        h('div', { class: 'product-item-meta', text: (p.dept === 'kids' ? 'Kids' : 'Men') + ', ' + catOf(p).label + ' · ' + formatPrice(p.price) })
      ]),
      h('button', { class: 'btn btn-outline btn-small', type: 'button', onclick: function () { openForm(p.id); } }, 'Edit')
    ]);
  }

  function productsSection() {
    var list = state.products;
    return h('section', { class: 'admin-section' }, [
      h('div', { class: 'admin-section-head' }, [
        h('h2', { text: 'Products' }),
        h('button', { class: 'btn btn-red btn-small', type: 'button', onclick: function () { openForm(null); } }, 'Add product')
      ]),
      list.length
        ? h('ul', { class: 'product-list' }, list.map(productRow))
        : h('p', { class: 'hint', text: 'No products yet. Click Add product to list your first item.' })
    ]);
  }

  function closeForm() {
    if (!dlg) return;
    try { if (dlg.open && dlg.close) dlg.close(); } catch (e) { /* already closed */ }
    if (dlg.parentNode) dlg.parentNode.removeChild(dlg);
    dlg = null;
  }

  function openForm(id) {
    closeForm();
    var existing = id ? state.products.filter(function (x) { return x.id === id; })[0] : null;
    var photo = existing ? (existing.photo || '') : '';
    var deptVal = existing ? existing.dept : 'men';
    var confirming = false;

    var nameIn = h('input', { type: 'text', id: 'f-name', maxlength: '80', autocomplete: 'off', value: existing ? existing.name : '' });
    var priceIn = h('input', { type: 'number', id: 'f-price', min: '0', step: 'any', inputmode: 'decimal', value: existing ? String(existing.price) : '' });
    var catVal = existing ? catOf(existing).id : '';
    var catIn = h('select', { id: 'f-cat' }, [h('option', { value: '', text: 'Choose a category' })].concat(CATS.map(function (c) {
      return h('option', { value: c.id, selected: c.id === catVal, text: c.label });
    })));
    var rMen = h('input', { type: 'radio', name: 'f-dept', id: 'f-men', value: 'men', checked: deptVal === 'men' });
    var rKids = h('input', { type: 'radio', name: 'f-dept', id: 'f-kids', value: 'kids', checked: deptVal === 'kids' });
    var thumb = h('div', { class: 'photo-thumb weave' });
    var err = h('p', { class: 'form-error', role: 'alert' });
    var pickBtn = h('button', { type: 'button', class: 'btn btn-outline btn-small' });
    var removeBtn = h('button', { type: 'button', class: 'btn btn-outline btn-small' }, 'Remove photo');
    var fileIn = h('input', { type: 'file', accept: 'image/*', class: 'visually-hidden', tabindex: '-1', 'aria-hidden': 'true' });

    function paintPhoto() {
      thumb.textContent = '';
      if (photo) thumb.appendChild(h('img', { src: photo, alt: '' }));
      pickBtn.disabled = false;
      pickBtn.textContent = photo ? 'Change photo' : 'Choose photo';
      removeBtn.hidden = !photo;
    }
    pickBtn.addEventListener('click', function () { fileIn.click(); });
    removeBtn.addEventListener('click', function () { photo = ''; paintPhoto(); });
    fileIn.addEventListener('change', function () {
      var f = fileIn.files && fileIn.files[0];
      if (!f) return;
      readImage(f, 720, function (e, url) {
        if (e) { err.textContent = 'That file couldn’t be read as a photo. Try a JPG or PNG.'; return; }
        err.textContent = '';
        pickBtn.disabled = true;
        pickBtn.textContent = 'Uploading…';
        uploadPhoto(url).then(function (hostedUrl) {
          photo = hostedUrl;
          paintPhoto();
        }, function () {
          err.textContent = 'That photo couldn’t be uploaded. Check your connection and try again.';
          paintPhoto();
        });
      });
    });
    paintPhoto();

    function save() {
      var name = nameIn.value.trim();
      var raw = priceIn.value.trim();
      var price = Number(raw);
      if (!name) { err.textContent = 'Enter the product name.'; nameIn.focus(); return; }
      if (raw === '' || !isFinite(price) || price < 0) { err.textContent = 'Enter the price as a number, for example 2500.'; priceIn.focus(); return; }
      var d = rKids.checked ? 'kids' : 'men';
      var c = catIn.value;
      if (!c) { err.textContent = 'Choose a category.'; catIn.focus(); return; }
      if (existing) {
        existing.name = name; existing.price = price; existing.dept = d; existing.cat = c; existing.photo = photo;
      } else {
        state.products.unshift({ id: newId(), name: name, price: price, dept: d, cat: c, photo: photo, added: Date.now() });
      }
      closeForm();
      changed();
    }
    function onEnter(e) { if (e.key === 'Enter') { e.preventDefault(); save(); } }
    nameIn.addEventListener('keydown', onEnter);
    priceIn.addEventListener('keydown', onEnter);

    var delBtn = existing ? h('button', { type: 'button', class: 'btn btn-danger btn-small' }, 'Delete product') : null;
    if (delBtn) {
      delBtn.addEventListener('click', function () {
        if (!confirming) { confirming = true; delBtn.textContent = 'Confirm delete'; return; }
        state.products = state.products.filter(function (x) { return x.id !== existing.id; });
        closeForm();
        changed();
      });
    }

    dlg = h('dialog', { class: 'dialog', 'aria-labelledby': 'dlg-title' }, h('div', { class: 'dialog-in' }, [
      h('h2', { id: 'dlg-title', text: existing ? 'Edit product' : 'Add product' }),
      h('div', { class: 'field' }, [h('label', { for: 'f-name', text: 'Product name' }), nameIn]),
      h('div', { class: 'field' }, [h('label', { for: 'f-price', text: 'Price in rupees' }), priceIn]),
      h('fieldset', { class: 'field' }, [
        h('legend', { text: 'Section' }),
        h('div', { class: 'radios' }, [
          h('label', { for: 'f-men' }, [rMen, 'Men']),
          h('label', { for: 'f-kids' }, [rKids, 'Kids'])
        ])
      ]),
      h('div', { class: 'field' }, [h('label', { for: 'f-cat', text: 'Category' }), catIn]),
      h('div', { class: 'field' }, [
        h('span', { class: 'field-title', text: 'Photo (optional)' }),
        h('div', { class: 'photo-row' }, [thumb, fileIn, pickBtn, removeBtn])
      ]),
      err,
      h('div', { class: 'dialog-actions' }, [
        h('button', { type: 'button', class: 'btn btn-red btn-small', onclick: save }, 'Save product'),
        h('button', { type: 'button', class: 'btn btn-outline btn-small', onclick: closeForm }, 'Cancel'),
        delBtn ? h('span', { class: 'spacer' }) : null,
        delBtn
      ]),
      h('p', { class: 'hint', text: 'Saved products appear on the website after you press Publish changes.' })
    ]));
    dlg.addEventListener('cancel', function (e) { e.preventDefault(); closeForm(); });
    document.body.appendChild(dlg);
    if (typeof dlg.showModal === 'function') dlg.showModal(); else dlg.setAttribute('open', '');
    nameIn.focus();
  }

  /* ---------- sign-in ---------- */

  function authView() {
    var setup = !ownerExists;
    var working = false;
    var userIn = h('input', { type: 'text', id: 'a-user', maxlength: '60', autocomplete: 'username', autocapitalize: 'none', spellcheck: 'false' });
    var passIn = h('input', { type: 'password', id: 'a-pass', maxlength: '200', autocomplete: setup ? 'new-password' : 'current-password' });
    var pass2In = setup ? h('input', { type: 'password', id: 'a-pass2', maxlength: '200', autocomplete: 'new-password' }) : null;
    var err = h('p', { class: 'form-error', role: 'alert' });
    var goBtn = h('button', { type: 'button', class: 'btn btn-red btn-small' }, setup ? 'Create sign-in' : 'Sign in');

    function setWorking(on, label) {
      working = on;
      goBtn.disabled = on;
      goBtn.textContent = on ? label : (setup ? 'Create sign-in' : 'Sign in');
    }
    function fail(msg, el) { setWorking(false); err.textContent = msg; if (el) el.focus(); }

    function submit() {
      if (working) return;
      var u = userIn.value.trim();
      var pw = passIn.value;
      err.textContent = '';
      if (setup) {
        if (u.length < 3) { fail('Choose a username with at least 3 characters.', userIn); return; }
        if (pw.length < 8) { fail('Choose a password with at least 8 characters.', passIn); return; }
        if (pw !== pass2In.value) { fail('The two passwords don’t match.', pass2In); return; }
        setWorking(true, 'Saving…');
        fetch('/api/auth/setup', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin',
          body: JSON.stringify({ username: u, password: pw })
        }).then(function (res) {
          if (res.status === 409) { ownerExists = true; setWorking(false); render(); return; }
          if (!res.ok) { fail('Sign-in can’t be created right now. Try again.'); return; }
          ownerExists = true;
          loggedIn = true;
          notice = 'Sign-in created. You can now add products.';
          render();
        }, function () { fail('Sign-in can’t be created right now. Check your connection.'); });
      } else {
        if (!u || !pw) { fail('Enter your username and password.', u ? passIn : userIn); return; }
        setWorking(true, 'Checking…');
        fetch('/api/auth/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin',
          body: JSON.stringify({ username: u, password: pw })
        }).then(function (res) {
          if (res.status === 429) { fail('Too many attempts. Wait a few minutes and try again.'); return; }
          if (!res.ok) { passIn.value = ''; fail('That username or password isn’t right.', passIn); return; }
          loggedIn = true;
          notice = '';
          render();
        }, function () { fail('Sign-in isn’t available right now. Check your connection.'); });
      }
    }
    function onEnter(e) { if (e.key === 'Enter') { e.preventDefault(); submit(); } }
    [userIn, passIn, pass2In].forEach(function (el) { if (el) el.addEventListener('keydown', onEnter); });
    goBtn.addEventListener('click', submit);

    return h('div', { class: 'auth-wrap' }, h('div', { class: 'auth-card' }, [
      h('div', { class: 'auth-brand', text: '@Tag Inc' }),
      h('h1', { id: 'dlg-title', text: setup ? 'Create owner sign-in' : 'Owner sign in' }),
      setup ? h('p', { class: 'hint', text: 'Pick a password you don’t use anywhere else. You’ll enter it each time you sign in here.' }) : null,
      h('div', { class: 'field' }, [h('label', { for: 'a-user', text: 'Username' }), userIn]),
      h('div', { class: 'field' }, [h('label', { for: 'a-pass', text: 'Password' }), passIn]),
      setup ? h('div', { class: 'field' }, [h('label', { for: 'a-pass2', text: 'Repeat password' }), pass2In]) : null,
      err,
      goBtn,
      h('p', { class: 'hint' }, h('a', { href: '/', text: '← Back to the site' }))
    ]));
  }

  /* ---------- render ---------- */

  function adminBar() {
    var msg = busy ? 'Publishing your changes…' : notice ? notice : dirty() ? 'You have changes that visitors can’t see yet.' : 'Signed in as owner.';
    var actions = [
      dirty() ? h('button', { class: 'btn btn-red btn-small', type: 'button', disabled: busy, onclick: publish }, 'Publish changes') : null,
      dirty() ? h('button', { class: 'btn btn-ghost-light btn-small', type: 'button', disabled: busy, onclick: discard }, 'Discard changes') : null,
      h('a', { class: 'btn btn-ghost-light btn-small', href: '/', text: 'View live site' }),
      h('button', { class: 'btn btn-ghost-light btn-small', type: 'button', disabled: busy, onclick: signOut }, 'Sign out')
    ];
    return h('div', { class: 'adminbar' }, h('div', { class: 'adminbar-in' }, [
      h('span', { class: 'adminbar-msg', role: 'status', text: msg }),
      h('div', { class: 'adminbar-actions' }, actions)
    ]));
  }

  function render() {
    var app = document.getElementById('app');
    if (!app) return;
    app.textContent = '';
    if (!loaded) { app.appendChild(h('p', { class: 'admin-loading', text: 'Loading…' })); return; }
    if (!loggedIn) { app.appendChild(authView()); return; }
    app.appendChild(adminBar());
    app.appendChild(h('main', { class: 'admin-main' }, [photosSection(), productsSection()]));
  }

  render();

  Promise.all([
    fetch('/api/state', { credentials: 'same-origin' }).then(function (res) { return res.ok ? res.json() : null; }).catch(function () { return null; }),
    fetch('/api/auth/session', { credentials: 'same-origin' }).then(function (res) { return res.ok ? res.json() : null; }).catch(function () { return null; })
  ]).then(function (r) {
    var st = r[0], s = r[1];
    if (st && typeof st === 'object') {
      state = st;
      if (!state.photos || typeof state.photos !== 'object') state.photos = {};
      if (!state.alts || typeof state.alts !== 'object') state.alts = {};
      if (!state.tints || typeof state.tints !== 'object') state.tints = {};
      if (!Array.isArray(state.products)) state.products = [];
      if (typeof state.logo !== 'string') state.logo = '';
    }
    saved = JSON.stringify(state);
    if (s) { loggedIn = !!s.loggedIn; ownerExists = !!s.ownerExists; }
    loaded = true;
    render();
  });

  window.addEventListener('beforeunload', function (e) {
    if (loggedIn && dirty() && !busy) { e.preventDefault(); e.returnValue = ''; }
  });
})();
</script>
</body>
</html>
